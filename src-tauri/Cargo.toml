[package]
name = "z-biz-tool-box"
version = "0.3.2"
description = "插件化工具箱"
edition = "2021"
license = "MIT"

[lib]
name = "z_biz_tool_box_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
reqwest = { version = "0.12", features = ["json", "blocking"] }
chrono = "0.4"
tauri-plugin-opener = "~2.5.5"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 家族统一深链协议（cap-hub）：zbiz:// 的构造、解析、待处理队列与产品清单。
#
# 2026-10-30 由本仓私有 src/handoff.rs 迁出。原实现是 box 的私有副本，
# 而 13 个兄弟仓的 single-instance 回调全是 `_argv`（丢弃）—— 协议只长在 box 里，
# 别人就接不上。capability 仓是家族 Rust 依赖的唯一版本源，与 cap-doc / cap-llm 同构。
#
# "tauri" feature 打开 receiver 胶水层（AppHandle / 事件 / Tauri 命令）；
# 核心协议是纯函数、零 tauri 依赖，可被非 Tauri 宿主直接复用。
cap-hub = { path = "../../z-biz-tool-capability/crates/cap-hub", features = ["tauri"] }
