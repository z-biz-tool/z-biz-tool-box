[package]
name = "z-biz-tool-box"
version = "0.3.3"
description = "插件化工具箱"
edition = "2021"
license = "MIT"

[lib]
name = "z_biz_tool_box_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
# 同上，钉 ~ 免得 tauri-build 被顶到新 minor 后与 tauri 运行时错配
tauri-build = { version = "~2.7.4", features = [] }
serde_json = "1"

[dependencies]
# Tauri 系依赖全部钉到 ~（不是 caret）：
#   tauri-cli 会比对 NPM 包与 Rust crate 的 major/minor，不一致直接拒绝 build。
#   caret（"2"）会让 cargo 解析到最新 minor，下次 cargo update 就把 crate 顶到
#   2.13/2.14，而前端 @tauri-apps/* 还钉在旧 minor —— 又一次错配。
#   锁在 ~ 里 minor 不会漂，两侧对得上的状态就能一直成立。
tauri = { version = "~2.12.5", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-clipboard-manager = "~2.3.2"
tauri-plugin-dialog = "~2.7.2"
tauri-plugin-fs = "~2.5.1"
tauri-plugin-shell = "~2.3.5"
tauri-plugin-global-shortcut = "~2.3.2"
tauri-plugin-http = { version = "~2.5.9", features = ["unsafe-headers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
reqwest = { version = "0.12", features = ["json", "blocking"] }
chrono = "0.4"
tauri-plugin-opener = "~2.5.5"
tauri-plugin-single-instance = "~2.5.4"
tauri-plugin-updater = "~2.14.0"
tauri-plugin-process = "~2.4.0"
# 家族统一深链协议（cap-hub）：zbiz:// 的构造、解析、待处理队列与产品清单。
#
# 2026-10-30 由本仓私有 src/handoff.rs 迁出。原实现是 box 的私有副本，
# 而 13 个兄弟仓的 single-instance 回调全是 `_argv`（丢弃）—— 协议只长在 box 里，
# 别人就接不上。capability 仓是家族 Rust 依赖的唯一版本源，与 cap-doc / cap-llm 同构。
#
# "tauri" feature 打开 receiver 胶水层（AppHandle / 事件 / Tauri 命令）；
# 核心协议是纯函数、零 tauri 依赖，可被非 Tauri 宿主直接复用。
cap-hub = { path = "../../z-biz-tool-capability/crates/cap-hub", version = "0.1.0", features = ["tauri"] }
# 能力层：图片原语（cap-img 0.4.0）与屏幕采集（cap-screen 0.1.0）。
#
# 2026-11-01 起 box 的「截图工具」不再用前端的 getDisplayMedia 模拟版，
# 改走真截屏：cap-screen 用 xcap 采像素（多显示器/窗口/区域都支持），
# 像素级编辑全部下沉到 cap-img —— 前端只做选框交互与预览。
cap-img = "0.4.0"
cap-screen = { path = "../../z-biz-tool-capability/crates/cap-screen", version = "0.1.0" }
# 截屏薄壳要把 RGBA 帧编成 PNG（无损，截图主体常是文字）
image = "0.25"
base64 = "0.22"

# ---- 体积与构建产物治理（2026-11-03 全仓统一）----
# release 关闭调试符号与增量编译：产物体积约为 debug 的 1/3~1/5，
# 且避免 incremental/ 缓存随编译会话无限累积（Tauri 家族 16 仓曾累积 80GB+）。
[profile.release]
debug = false
incremental = false
strip = "symbols"
