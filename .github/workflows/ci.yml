name: CI

# 原先只有 build.yml（`push: tags: v*` + 四平台 tauri build），推 main 完全不设门禁：
# 想确认一次"typecheck / 测试过不过"就得打个 tag，付四份打包的开销。
# 这里把廉价门禁拆出来每次 push / PR 跑；出包仍然只认 tag。
#
# 后端只排 ubuntu-22.04：本仓 src-tauri 里没有 cfg(windows)/cfg(unix) 分支，
# macOS 那条腿与本地开发环境重复，加上去只是多烧 runner。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同分支后一次推送取消前一次：多会话并行直推 main 时，不取消会次次占满 runner。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: 前端 typecheck + 构建
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 本仓的 tests/*.test.ts 此前从来没进过 CI：仓库里有测试、package.json 里有
      # test 脚本，但这条流水线只跑 typecheck + build（Rust 那边有 cargo test，
      # 前端这边一个断言都没跑）。改了逻辑红了，CI 不会知道。
      # 放在 Build 之前：断言是秒级的，挂在构建后面等于白挂。
      - name: Unit tests
        run: npm test

      # 桥接安全自检: 断言沙箱不含 allow-same-origin、协议层拒绝伪造/越权包、
      # 以及**源码层面**的接线(例如 buildZbizApi 真的把权限集传进去了)。
      # 这条脚本抓的是"测试覆盖不到的接线"—— 逻辑对但没接上, 单测照样全绿。
      - name: Plugin bridge self-check
        run: npm run check:bridge

      # dist 在 .gitignore 里，而 tauri::generate_context! 要读 frontendDist，
      # 所以任何 cargo 步骤之前必须先出一次前端。
      - name: Build frontend
        run: npm run build

  backend:
    name: Rust test + clippy
    # 24.04：cap-screen → xcap → libspa 0.10 需要新 SPA 头，22.04 的
    # libspa-0.2-dev 编不过（capability 仓 2026-11-01 第三轮实锤同款）。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # cap-hub 走 ../../z-biz-tool-capability path 依赖：runner 上只有本仓，
      # 先把公共能力仓取到 workspace 内，再链接成 src-tauri 的同级目录。
      - name: Checkout capability (path deps)
        uses: actions/checkout@v4
        with:
          repository: z-biz-tool/z-biz-tool-capability
          path: .capability

      - name: Link capability (Unix)
        if: runner.os != 'Windows'
        run: ln -sfn "$GITHUB_WORKSPACE/.capability" "$GITHUB_WORKSPACE/../z-biz-tool-capability"

      - name: Link capability (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\..\z-biz-tool-capability" -Target "$env:GITHUB_WORKSPACE\.capability" | Out-Null

      # build.rs codegen 从 ../../z-biz-tool-lead/003_辅助能力/bootstrap/manifest.json
      # 读兄弟清单（SSoT）。runner 上缺 lead ⇒ 清单为空 ⇒ cargo test 的
      # 「应有 15 张卡」断言红（2026-11-01 实锤）。补上 lead 的 checkout 并链接。
      - name: Checkout lead (brother manifest)
        uses: actions/checkout@v4
        with:
          repository: z-biz-tool/z-biz-tool-lead
          path: .lead
          # lead 是 org 里唯一的**私有仓**，默认 GITHUB_TOKEN 只有当前仓权限
          # ⇒ 跨仓 checkout 404（2026-11-01 实锤，两次红）。PAT 经仓 secret
          # 下发（FAMILY_PAT / LEAD_READ_PAT 是同一把 token 的两个名字，
          # fallback GITHUB_TOKEN 只为 public 场景兜底）。
          token: ${{ secrets.FAMILY_PAT || secrets.LEAD_READ_PAT || secrets.GITHUB_TOKEN }}

      - name: Link lead (Unix)
        if: runner.os != 'Windows'
        run: ln -sfn "$GITHUB_WORKSPACE/.lead" "$GITHUB_WORKSPACE/../z-biz-tool-lead"

      - name: Link lead (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\..\z-biz-tool-lead" -Target "$env:GITHUB_WORKSPACE\.lead" | Out-Null

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libpipewire-0.3-dev：cap-screen → xcap → pipewire 的 Linux 系统依赖
          # libgbm-dev：xcap → gbm → gbm-sys 链接期要 -lgbm（2026-11-01 实锤：
          # 24.04 上装了 pipewire 还缺 gbm，链接期 `unable to find library -lgbm`）
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libpipewire-0.3-dev libgbm-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy

      # runner 上新版 token 会写坏 rust-toolchain 生成的 cargo config（与 build.yml 同一条 workaround）
      - name: Reset broken cargo config
        run: rm -f "$HOME/.cargo/config.toml"

      - name: Build frontend (for Tauri context)
        run: |
          npm ci
          npm run build

      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked

      # 本轮（2026-10-19）已把 clippy 告警清零并实测 `cargo clippy --all-targets -- -D warnings` rc=0，
      # 于是按原注释里写的条件（「跑出干净结果后再收严」）把它转成硬门禁。
      # 为什么要硬门禁：advisory 形态下 clippy 从来没真正挡过任何东西 ——
      # 告警照出、流水线照绿，等于没有门禁。
      # 诚实说明风险：CI 用 `dtolnay/rust-toolchain@1.99.0`，stable 升级会带进**新的 lint**
      # （本轮就撞上 Rust 1.98 新增的 `clippy::doc_lazy_continuation`），
      # 那时 CI 会红 —— 这是刻意的：宁可因为工具链前进而红，也不要悄悄漂移。
      - name: Clippy (warnings are errors)
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      # fmt 门禁此前**根本不存在**（仓库里有 rustfmt，但没有哪条流水线检查过它）。
      # 格式差异与平台无关，本地就能量 ⇒ 可以安全地加成硬门禁。
      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --all --check
